name: nabd_cashier
description: Nabd cashier app - sells offline-first and syncs to the Nabd server.
publish_to: none
version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  uuid: ^4.4.0
  pdf: ^3.11.0
  printing: ^5.13.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E5A48"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
